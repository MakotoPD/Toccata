[package]
name = "toccata-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
thiserror = "2.0.19"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Devices_Cdrom", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_WindowsProgramming"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
