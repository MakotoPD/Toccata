[package]
name = "toccata-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Platform TLS on purpose, and note that reqwest's `default-tls` no longer
# means that: since 0.13 it resolves to rustls with aws-lc-sys, which needs a C
# toolchain plus CMake and NASM to build. Schannel, Security.framework and the
# OpenSSL that Tauri already requires on Linux cost nothing extra.
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "json", "charset", "http2", "gzip", "system-proxy", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
thiserror = "2.0.19"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Devices_Cdrom", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_WindowsProgramming"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
